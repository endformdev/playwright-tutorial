name: Playwright Intent

on:
  pull_request:
    branches:
      - webinar/main

permissions:
  contents: write # the agent commits changed steps to the pull request
  id-token: write # used by the Vercel deployment action

jobs:
  e2e:
    if: github.repository == 'endformdev/playwright-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: endform-playwright-tutorial
          set-url-env-var: BASE_URL
          set-vercel-bypass-env-var: VERCEL_BYPASS_TOKEN

      - name: Run intent tests
        run: pnpm exec playwright test -c playwright.intent.config.ts
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
